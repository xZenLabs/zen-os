name: Generate Linux Goldens

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
      KOREADER_CACHE_VERSION: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - name: Install KOReader emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gettext git lua5.1 luarocks meson nasm ninja-build pkg-config xvfb \
            libsdl2-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev libxtst-dev \
            libfribidi-dev libpng-dev libjpeg-dev libsqlite3-dev
          luarocks --tree="$GITHUB_WORKSPACE/.luarocks" install luacheck

      - name: Restore stable KOReader build
        id: stable-koreader-cache
        uses: actions/cache/restore@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: koreader-runtime-stable-${{ runner.os }}-${{ runner.arch }}-v${{ env.KOREADER_CACHE_VERSION }}-${{ hashFiles('spec/koreader-lock.json', 'spec/provision-koreader.sh') }}

      - name: Provision pinned stable KOReader
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh stable)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Save stable KOReader build
        if: ${{ steps.stable-koreader-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: ${{ steps.stable-koreader-cache.outputs.cache-primary-key }}

      - name: Generate candidate goldens
        run: ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run update-goldens

      - name: Upload candidate goldens
        uses: actions/upload-artifact@v4
        with:
          name: linux-goldens
          path: spec/goldens/v2026.07/linux-800x600
          if-no-files-found: error
