name: Nightly KOReader Smoke Test

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to test (defaults to the selected branch)
        required: false
        type: string

concurrency:
  group: nightly-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  nightly:
    name: Nightly KOReader smoke test
    runs-on: ubuntu-latest
    env:
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - uses: ./.github/actions/koreader-deps

      - name: Provision latest nightly KOReader
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh nightly)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Run nightly compatibility smoke test
        run: ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run nightly-smoke

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-artifacts
          path: spec/.artifacts
          include-hidden-files: true
          if-no-files-found: ignore
