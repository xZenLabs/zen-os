name: Test Suite

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test level
        required: true
        default: smoke
        type: choice
        options: [lua, smoke, full]
  workflow_call:
    inputs:
      suite:
        required: false
        default: full
        type: string
      ref:
        required: false
        type: string

jobs:
  stable:
    name: Stable KOReader Test
    runs-on: ubuntu-latest
    env:
      REQUESTED_SUITE: ${{ inputs.suite || github.event.inputs.suite || '' }}
      BASE_REF: ${{ github.base_ref }}
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
      KOREADER_CACHE_VERSION: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - name: Install KOReader emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gettext git lua5.1 luarocks meson nasm ninja-build pkg-config xvfb \
            libsdl2-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev libxtst-dev \
            libfribidi-dev libpng-dev libjpeg-dev libsqlite3-dev
          python -m pip install fonttools
          luarocks --tree="$GITHUB_WORKSPACE/.luarocks" install luacheck

      - name: Restore stable KOReader build
        id: stable-koreader-cache
        uses: actions/cache/restore@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: koreader-runtime-stable-${{ runner.os }}-${{ runner.arch }}-v${{ env.KOREADER_CACHE_VERSION }}-${{ hashFiles('spec/koreader-lock.json', 'spec/provision-koreader.sh') }}

      - name: Provision stable KOReader
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh stable)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Save stable KOReader build
        if: ${{ github.event_name != 'pull_request' && steps.stable-koreader-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: ${{ steps.stable-koreader-cache.outputs.cache-primary-key }}

      - name: Run test suite
        run: |
          if [[ "$REQUESTED_SUITE" == "full" || "$BASE_REF" == "main" ]]; then
            ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run full
          elif [[ "$REQUESTED_SUITE" == "lua" ]]; then
            ./spec/run lua
          else
            ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run smoke
          fi

      - name: Zen UI to ZenOS migration test (current stable)
        if: ${{ github.event_name == 'workflow_dispatch' && env.REQUESTED_SUITE != 'lua' }}
        run: xvfb-run -s '-screen 0 800x600x24' ./spec/run legacy-upgrade

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-test-artifacts
          path: spec/.artifacts
          if-no-files-found: ignore

  compat:
    name: Zen UI to ZenOS migration test (KOReader v2026.03)
    needs: stable
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.suite != 'lua' && github.event.inputs.suite != 'lua' }}
    runs-on: ubuntu-latest
    env:
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
      KOREADER_CACHE_VERSION: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - name: Install KOReader emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gettext git lua5.1 luarocks meson nasm ninja-build pkg-config xvfb \
            libsdl2-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev libxtst-dev \
            libfribidi-dev libpng-dev libjpeg-dev libsqlite3-dev
          python -m pip install fonttools

      - name: Restore KOReader v2026.03 build
        id: compat-koreader-cache
        uses: actions/cache/restore@v4
        with:
          path: spec/.cache/koreader/compat/runtime
          key: koreader-runtime-compat-${{ runner.os }}-${{ runner.arch }}-v${{ env.KOREADER_CACHE_VERSION }}-${{ hashFiles('spec/koreader-lock.json', 'spec/provision-koreader.sh') }}

      - name: Provision KOReader v2026.03
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh compat)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Save KOReader v2026.03 build
        if: ${{ github.event_name != 'pull_request' && steps.compat-koreader-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: spec/.cache/koreader/compat/runtime
          key: ${{ steps.compat-koreader-cache.outputs.cache-primary-key }}

      - name: Zen UI to ZenOS migration test
        run: xvfb-run -s '-screen 0 800x600x24' ./spec/run legacy-upgrade

      - name: Upload Zen UI to ZenOS migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v2026.03-zen-ui-to-zenos-migration-artifacts
          path: spec/.artifacts
          if-no-files-found: ignore

  nightly:
    name: Nightly KOReader smoke test
    needs: stable
    if: ${{ github.base_ref == 'dev' }}
    runs-on: ubuntu-latest
    env:
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - name: Install KOReader emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gettext git lua5.1 luarocks meson nasm ninja-build pkg-config xvfb \
            libsdl2-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev libxtst-dev \
            libfribidi-dev libpng-dev libjpeg-dev libsqlite3-dev
          luarocks --tree="$GITHUB_WORKSPACE/.luarocks" install luacheck

      - name: Provision latest nightly KOReader
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh nightly)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Run nightly compatibility smoke test
        run: ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run nightly-smoke

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-artifacts
          path: spec/.artifacts
          if-no-files-found: ignore
