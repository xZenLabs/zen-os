name: Test Suite

on:
  pull_request:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      suite:
        description: Test level
        required: true
        default: smoke
        type: choice
        options: [lua, smoke, full]
  workflow_call:
    inputs:
      suite:
        required: false
        default: full
        type: string
      ref:
        required: false
        type: string

jobs:
  stable:
    name: Stable KOReader Test (${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.suite == 'lua' && '[1]' || '[1,2,3,4]') }}
    env:
      REQUESTED_SUITE: ${{ inputs.suite || github.event.inputs.suite || '' }}
      BASE_REF: ${{ github.base_ref }}
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
      KOREADER_CACHE_VERSION: 3
      ZEN_UI_PYTEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - uses: ./.github/actions/koreader-deps

      - name: Restore stable KOReader build
        id: stable-koreader-cache
        uses: actions/cache/restore@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: koreader-runtime-stable-${{ runner.os }}-${{ runner.arch }}-v${{ env.KOREADER_CACHE_VERSION }}-${{ hashFiles('spec/koreader-lock.json', 'spec/provision-koreader.sh') }}

      - name: Provision stable KOReader
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh stable)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Save stable KOReader build
        if: ${{ matrix.shard == 1 && github.event_name != 'pull_request' && steps.stable-koreader-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: ${{ steps.stable-koreader-cache.outputs.cache-primary-key }}

      - name: Run test suite
        run: |
          if [[ "$REQUESTED_SUITE" == "full" || "$BASE_REF" == "main" ]]; then
            ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run full
          elif [[ "$REQUESTED_SUITE" == "lua" ]]; then
            ./spec/run lua
          else
            ZEN_UI_RUN_EMULATOR=1 xvfb-run -s '-screen 0 800x600x24' ./spec/run smoke
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-test-artifacts-${{ matrix.shard }}
          path: spec/.artifacts
          include-hidden-files: true
          if-no-files-found: ignore
