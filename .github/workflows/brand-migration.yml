name: Zen UI to ZenOS Migration

on:
  workflow_dispatch:

jobs:
  migration:
    name: Zen UI to ZenOS migration test (KOReader ${{ matrix.runtime }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [stable, compat]
    env:
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
      KOREADER_CACHE_VERSION: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - name: Install KOReader emulator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gettext git lua5.1 luarocks meson nasm ninja-build pkg-config xvfb \
            libsdl2-dev libfreetype6-dev libfontconfig1-dev libharfbuzz-dev libxtst-dev \
            libfribidi-dev libpng-dev libjpeg-dev libsqlite3-dev
          python -m pip install fonttools

      - name: Restore KOReader build
        id: koreader-cache
        uses: actions/cache/restore@v4
        with:
          path: spec/.cache/koreader/${{ matrix.runtime }}/runtime
          key: koreader-runtime-${{ matrix.runtime }}-${{ runner.os }}-${{ runner.arch }}-v${{ env.KOREADER_CACHE_VERSION }}-${{ hashFiles('spec/koreader-lock.json', 'spec/provision-koreader.sh') }}

      - name: Provision KOReader
        env:
          KOREADER_RUNTIME: ${{ matrix.runtime }}
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh "$KOREADER_RUNTIME")"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Save KOReader build
        if: ${{ steps.koreader-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: spec/.cache/koreader/${{ matrix.runtime }}/runtime
          key: ${{ steps.koreader-cache.outputs.cache-primary-key }}

      - name: Zen UI to ZenOS migration test
        run: xvfb-run -s '-screen 0 800x600x24' ./spec/run legacy-upgrade

      - name: Upload Zen UI to ZenOS migration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runtime }}-zen-ui-to-zenos-migration-artifacts
          path: spec/.artifacts
          if-no-files-found: ignore
