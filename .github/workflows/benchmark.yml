name: Benchmark

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

jobs:
  benchmark:
    name: Emulator benchmark
    runs-on: ubuntu-latest
    env:
      ZEN_UI_KOREADER_CACHE: ${{ github.workspace }}/spec/.cache/koreader
      KOREADER_CACHE_VERSION: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: spec/python/requirements.txt

      - uses: ./.github/actions/koreader-deps

      - name: Restore stable KOReader build
        uses: actions/cache/restore@v4
        with:
          path: spec/.cache/koreader/stable/runtime
          key: koreader-runtime-stable-${{ runner.os }}-${{ runner.arch }}-v${{ env.KOREADER_CACHE_VERSION }}-${{ hashFiles('spec/koreader-lock.json', 'spec/provision-koreader.sh') }}

      - name: Provision stable KOReader
        run: |
          KOREADER_DIR="$(./spec/provision-koreader.sh stable)"
          echo "KOREADER_DIR=$KOREADER_DIR" >> "$GITHUB_ENV"

      - name: Run benchmark
        run: xvfb-run -s '-screen 0 800x600x24' ./spec/run bench

      # Job summary + log keep a per-deployment record in the Actions run history.
      - name: Publish benchmark report
        if: always()
        run: |
          REPORT=spec/.artifacts/benchmark/REPORT.md
          [[ -f "$REPORT" ]] || { echo "::warning::No benchmark report produced"; exit 0; }
          cat "$REPORT"
          cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-${{ inputs.ref || github.sha }}
          path: |
            spec/.artifacts/benchmark/REPORT.md
            spec/.artifacts/benchmark/results.json
            spec/.artifacts/benchmark/logs
          retention-days: 90
          if-no-files-found: ignore
