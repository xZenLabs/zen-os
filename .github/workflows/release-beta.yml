name: Release Alpha / Beta

on:
  push:
    branches:
      - dev
  workflow_dispatch:
    inputs:
      channel:
        description: Prerelease channel
        required: true
        default: beta
        type: choice
        options:
          - beta
          - alpha

jobs:
  tests:
    name: Full test suite
    needs: luacheck
    uses: ./.github/workflows/test.yml
    with:
      suite: full
      ref: ${{ needs.luacheck.outputs.commit }}

  luacheck:
    name: LuaCheck
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, 'ci-skip') }}
    outputs:
      commit: ${{ steps.checkout.outputs.commit }}

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.sha }}

      - name: Run LuaCheck gate
        uses: ./.github/actions/luacheck-gate
        with:
          lua-version: "5.1"
          targets: "_meta.lua main.lua common config modules"

  release:
    name: Build & Release
    needs: [luacheck, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.luacheck.outputs.commit }}

      - name: Read version from _meta.lua
        id: meta
        run: |
          VERSION=$(grep -oP '(?<=version = ")[^"]+' _meta.lua)
          if [[ -z "$VERSION" ]]; then
            echo "Error: could not extract version from _meta.lua" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve prerelease tag
        id: version_check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_CHANNEL: ${{ github.event_name == 'push' && 'alpha' || inputs.channel }}
        run: |
          META_VERSION="${{ steps.meta.outputs.version }}"
          BASE="v${META_VERSION}"

          # Get the latest release tag (including pre-releases)
          LATEST=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName \
            --jq '.[0].tagName' 2>/dev/null | sed 's/^v//' | sed -E 's/-(alpha|beta)[0-9]*$//')

          if [[ -n "$LATEST" ]]; then
            LOWER=$(printf '%s\n%s' "$META_VERSION" "$LATEST" | sort -V | head -1)
            if [[ "$LOWER" == "$META_VERSION" && "$META_VERSION" != "$LATEST" ]]; then
              echo "Version $META_VERSION is lower than current release $LATEST. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          N=1
          while gh release view "${BASE}-${RELEASE_CHANNEL}${N}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; do
            N=$((N + 1))
          done
          PRERELEASE_TAG="${BASE}-${RELEASE_CHANNEL}${N}"
          PRERELEASE_VERSION="${META_VERSION}-${RELEASE_CHANNEL}${N}"
          echo "tag=$PRERELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$PRERELEASE_VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Stamp prerelease version in _meta.lua
        if: steps.version_check.outputs.skip == 'false'
        run: |
          PRERELEASE_VERSION="${{ steps.version_check.outputs.version }}"
          sed -i "s/version = \"[^\"]*\"/version = \"${PRERELEASE_VERSION}\"/" _meta.lua

      - name: Install fonttools
        if: steps.version_check.outputs.skip == 'false'
        run: pip install fonttools

      - name: Download latest ZenOS Launcher
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE=$(gh api repos/xZenLabs/zen-reader-scriptlet/releases/latest)
          TAG=$(jq -r '.tag_name' <<< "$RELEASE")
          URL=$(jq -r '.assets[] | select(.name == "ZenReader.sh") | .browser_download_url' <<< "$RELEASE")
          SHA=$(jq -r '.assets[] | select(.name == "ZenReader.sh") | .digest | sub("^sha256:"; "")' <<< "$RELEASE")
          [[ "$URL" == "https://github.com/xZenLabs/zen-reader-scriptlet/releases/download/$TAG/ZenReader.sh" ]] || exit 1
          [[ "$SHA" =~ ^[0-9a-fA-F]{64}$ ]] || exit 1
          mkdir -p kindle-launcher
          curl -fsSL "$URL" -o kindle-launcher/ZenReader.sh
          echo "$SHA  kindle-launcher/ZenReader.sh" | sha256sum -c -
          grep -Fqx "# Version: ${TAG#v}" kindle-launcher/ZenReader.sh
          curl -fsSL "https://raw.githubusercontent.com/xZenLabs/zen-reader-scriptlet/$TAG/LICENSE" -o kindle-launcher/LICENSE

      - name: Build and verify plugin zips
        if: steps.version_check.outputs.skip == 'false'
        env:
          ZENOS_REQUIRE_KINDLE_LAUNCHER: "1"
        run: ./spec/run package-check

      - name: Build release notes
        if: steps.version_check.outputs.skip == 'false'
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          python3 .github/scripts/build_release_notes.py "$VERSION" > release_notes.md

      - name: Create release
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version_check.outputs.tag }}"
          gh release create "$TAG" \
            dist/zenos.koplugin.zip \
            dist/zen_ui.koplugin.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "ZenOS $TAG" \
            --notes-file release_notes.md \
            --prerelease \
            --target "${{ needs.luacheck.outputs.commit }}"

      - name: Refresh ZenPM package
        if: steps.version_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.ZENPM_REPO_TOKEN }}
        run: |
          gh workflow run scrape-plugins.yml \
            --repo xZenLabs/repo \
            --ref main \
            --field package=zen-ui
